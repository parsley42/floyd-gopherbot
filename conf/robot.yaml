# Floyd custom robot configuration.

LogLevel: {{ env "GOPHER_LOGLEVEL" | default "info" }}
LogDest: {{ env "GOPHER_LOGDEST" | default "stdout" }}

{{ $environment := env "GOPHER_ENVIRONMENT" | default "production" }}
{{ printf "environments/%s.yaml" $environment | .Include }}

{{ $workdir := env "GOPHER_WORKSPACE_DIRECTORY" | default "workspace" }}
{{ if $workdir -}} WorkSpace: {{ $workdir }} {{- end }}

AdminContact: "David Parsley, <parsley@linuxjedi.org>"
AdminUsers: [ "parsley" ]
# DefaultAuthorizer: groups

BotInfo:
  UserName: floyd
  Email: floyd@linuxjedi.org
  FullName: Floyd Gopherbot
  FirstName: Floyd
  LastName: Gopherbot

UserRoster:
- UserName: floyd
  BotUser: true
- UserName: clu
  BotUser: true
- UserName: github
  BotUser: true
- UserName: parsley
  Email: parsley@linuxjedi.org
  FullName: David Parsley
  FirstName: David
  LastName: Parsley
- UserName: alice

DefaultChannels: [ "floyd-jobs", "general", "random" ]
DefaultJobChannel: {{ variable "DEFAULT_JOB_CHANNEL" | printf "%q" }}
DefaultMessageFormat: BasicMarkdown
TimeZone: "America/New_York"
Alias: ";"

GoPlugins:
  "duo":
    Parameters:
    - Name: HOST
      Value: {{ secret "DUO_HOST" | printf "%q" }}
    - Name: IKEY
      Value: {{ secret "DUO_IKEY" | printf "%q" }}
    - Name: SKEY
      Value: {{ secret "DUO_SKEY" | printf "%q" }}

ExternalPlugins:
  "wireguard":
    Description: Plugin for configuring WireGuard VPN access
    Path: plugins/wireguard.lua
    Privileged: true
  "lua-sudo-harness":
    Description: Admin-only Lua and sudo development harness
    Path: plugins/lua_sudo_harness.lua
    Privileged: true
  "ai":
    Path: plugins/ai.rb
    Description: Disabled legacy Ruby AI plugin; use ai-fallback instead
    Disabled: true
  "ai-fallback":
    Path: plugins/go-ai-fallback/ai.go
    Description: A multi-user AI catchall plugin using a chat-completions provider
    Disabled: false
    ParameterSets:
    - "ai"
  "util":
    Description: A convenience plugin for various tasks
    Path: plugins/util.sh

ExternalJobs:
  "backup":
    Disabled: true
  "restore":
    Disabled: true

ExternalTasks:

NameSpaces:
  "ssh":
    Parameters:
    - Name: KEYNAME
      Value: "robot_rsa"
    - Name: BOT_SSH_PHRASE
      Value: {{ secret "ROBOT_SSH_PASSPHRASE" | printf "%q" }}

ParameterSets:
  "ai":
    Parameters:
    - Name: AI_API_KEY
      Value: {{ secret "GEMINI_API_KEY" | printf "%q" }}

ScheduledJobs:
- Name: "pause-notifies"
  Schedule: "0 0 8 * * *"
- Name: "go-ai-prune"
  Schedule: "0 15 3 * * *"
