# Floyd custom robot configuration.

LogLevel: {{ env "GOPHER_LOGLEVEL" | default "debug" }}
LogDest: {{ env "GOPHER_LOGDEST" | default "stdout" }}

PrimaryProtocol: {{ env "GOPHER_PROTOCOL" | default "ssh" }}
DefaultProtocol: {{ env "GOPHER_DEFAULT_PROTOCOL" | default "ssh" }}
SecondaryProtocols: [ "slack" ]

# Floyd's old Dynamo brain is gone. Keep him ephemeral until a persistent
# Google-backed brain is configured.
Brain: {{ env "GOPHER_BRAIN" | default "mem" }}
HistoryProvider: {{ env "GOPHER_HISTORY_PROVIDER" | default "mem" }}

{{ $workdir := env "GOPHER_WORKSPACE_DIRECTORY" | default "workspace" }}
{{ if $workdir -}} WorkSpace: {{ $workdir }} {{- end }}

AdminContact: "David Parsley, <parsley@linuxjedi.org>"
AdminUsers: [ "parse", "parsley", "meekohi" ]

BotInfo:
  UserName: floyd
  Email: floyd@linuxjedi.org
  FullName: Floyd Gopherbot
  FirstName: Floyd
  LastName: Gopherbot

UserRoster:
- UserName: floyd
  BotUser: true
- UserName: clu
  BotUser: true
- UserName: github
  BotUser: true
- UserName: parse
  Email: parsley@linuxjedi.org
  FullName: David Parsley
  FirstName: David
  LastName: Parsley
- UserName: parsley
  Email: parsley@linuxjedi.org
  FullName: David Parsley
  FirstName: David
  LastName: Parsley
- UserName: meekohi
- UserName: alice

DefaultChannels: [ "floyd-jobs", "ai" ]
DefaultJobChannel: {{ variable "DEFAULT_JOB_CHANNEL" | printf "%q" }}
DefaultMessageFormat: Raw
TimeZone: "America/New_York"
Alias: ";"

GoPlugins:
  "duo":
    Parameters:
    - Name: HOST
      Value: {{ secret "DUO_HOST" | printf "%q" }}
    - Name: IKEY
      Value: {{ secret "DUO_IKEY" | printf "%q" }}
    - Name: SKEY
      Value: {{ secret "DUO_SKEY" | printf "%q" }}

ExternalPlugins:
  "ai":
    Path: plugins/ai.rb
    Description: Disabled legacy Ruby AI plugin; use ai-fallback instead
    Disabled: true
  "ai-fallback":
    Path: plugins/go-ai-fallback/ai.go
    Description: A multi-user AI catchall plugin using a chat-completions provider
    Disabled: false
    ParameterSets:
    - "ai"
  "util":
    Description: A convenience plugin for various tasks
    Path: plugins/util.sh

ExternalJobs:
  "backup":
    Disabled: true
  "restore":
    Disabled: true

ExternalTasks:

NameSpaces:
  "ssh":
    Parameters:
    - Name: KEYNAME
      Value: "robot_rsa"
    - Name: BOT_SSH_PHRASE
      Value: {{ secret "ROBOT_SSH_PASSPHRASE" | printf "%q" }}

ParameterSets:
  "ai":
    Parameters:
    - Name: AI_API_KEY
      Value: {{ secret "GEMINI_API_KEY" | printf "%q" }}

ScheduledJobs:
- Name: "pause-notifies"
  Schedule: "0 0 8 * * *"
